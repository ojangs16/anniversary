<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Moments 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="blur-in-start">

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div id="floating-bg"></div>

  <!-- titik navigasi di atas: halaman 2 dari 4 -->
  <nav class="page-nav" aria-label="Page navigation">
    <a href="index.html" title="Welcome"></a>
    <a href="gallery.html" class="active" title="Moments"></a>
    <a href="reasons.html" title="10 Reasons"></a>
    <a href="letter.html" title="Birthday Letter"></a>
  </nav>

  <!-- ================================================================
       HALAMAN 2 — INTERACTIVE PHOTO SLIDESHOW
  ================================================================= -->
  <section id="gallery" class="page">
    <div class="section-header">
      <div class="hero-tape-tag" style="margin-bottom: 10px;">
        <span class="tape-left"></span>
        <span class="tape-text">foto-foto kesayangan kita 📷</span>
        <span class="tape-right"></span>
      </div>
      <h2 class="gallery-heading">our little moments <span class="heart">🩷</span></h2>
      <p class="gallery-sub">tap foto untuk kasih love • geser buat lihat semua</p>
    </div>

    <div class="slideshow-wrap">

      <!-- GIF dekorasi kecil di pojok -->
      <div class="corner-deco">
        <img src="assets/finger-guns-dudu.gif" alt="sparkle decoration">
      </div>

      <div class="slide-stage">
        <button class="arrow-btn" id="prevBtn" aria-label="previous photo">‹</button>

        <div class="photo-stage" id="photoStage">
          <div class="polaroid" id="polaroid">
            <div class="washi-tape"></div>
            <div class="photo-frame">
              <img id="currentPhoto" src="photos/photo1.jpeg" alt="memory one">
            </div>
            <div class="polaroid-tag" id="polaroidTag">✨ double tap for hearts! ✨</div>
          </div>

          <!-- GIF dekorasi di sisi kiri-bawah polaroid -->
          <div class="bottom-left-deco">
            <img src="assets/scuba.gif" alt="sparkle decoration">
          </div>
        </div>

        <button class="arrow-btn" id="nextBtn" aria-label="next photo">›</button>
      </div>

      <div class="caption-card">
        <p class="caption" id="currentCaption">Thank you for being a part of my life... every day with you feels like a
          gift.</p>
      </div>

      <div class="dots" id="dots">
        <button class="dot active" data-index="0" aria-label="photo 1"></button>
        <button class="dot" data-index="1" aria-label="photo 2"></button>
        <button class="dot" data-index="2" aria-label="photo 3"></button>
        <button class="dot" data-index="3" aria-label="photo 4"></button>
      </div>

      <p class="counter" id="counter">photo 1 of 4</p>
    </div>

    <div class="page-buttons">
      <a href="index.html" class="nav-btn secondary">← balik dulu</a>
      <a href="reasons.html" class="nav-btn-next" id="nextPageBtn">
        <span class="next-label">ada yg mau aku kasitau :> </span>
        <span class="next-sub">lanjut yuk 🩷</span>
        <span class="next-arrow">→</span>
      </a>
    </div>
  </section>

  <script src="js/script.js"></script>
  <script src="js/gallery.js"></script>
</body>

</html>
